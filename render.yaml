services:
  # Backend API + WebSockets (Socket.IO)
  - type: web
    name: hireflow-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:shared && npm run db:postgres && npm run build:api
    startCommand: npm run db:push && node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "none"
      - key: CORS_ORIGIN
        sync: false

  # Frontend React SPA
  - type: web
    name: hireflow-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:shared && npm run build:web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
